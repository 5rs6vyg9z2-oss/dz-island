name: Build and publish Windows update
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: windows-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Assign a version for this update
        shell: pwsh
        run: |
          $base = (Get-Content package.json -Raw | ConvertFrom-Json).version.Split('.')
          $version = "$($base[0]).$($base[1]).${{ github.run_number }}"
          bun run bump $version
          "RELEASE_VERSION=$version" >> $env:GITHUB_ENV
      - name: Install frontend dependencies
        run: bun install --frozen-lockfile
      - name: Test local HTTP boundary
        shell: pwsh
        run: |
          rustc --edition=2021 --test src-tauri/src/agent_http.rs -o agent-http-tests.exe
          ./agent-http-tests.exe
          rustc --edition=2021 --test src-tauri/src/update_policy.rs -o update-policy-tests.exe
          ./update-policy-tests.exe
          rustc --edition=2021 --test src-tauri/src/notch_hit_test.rs -o notch-hit-tests.exe
          ./notch-hit-tests.exe
          rustc --edition=2021 --test src-tauri/src/zeus_estimate_math.rs -o zeus-estimate-tests.exe
          ./zeus-estimate-tests.exe
      - name: Build the Windows app
        shell: pwsh
        run: |
          # Compatibility directory for Tauri's WebView2 loader discovery with Cargo 1.100.
          New-Item -ItemType Directory -Path src-tauri/target/release/build/build -Force | Out-Null
          bun run tauri build --no-bundle
      - name: Test native updater and recovery
        shell: pwsh
        run: ./scripts/test-portable-update.ps1
      - name: Test Zeus Bluetooth and estimate transitions
        run: 'cargo test --release --manifest-path src-tauri/Cargo.toml --bin dz-island zeus_estimate::'
      - name: Test pending agent question recovery
        run: cargo test --release --manifest-path src-tauri/Cargo.toml --bin dz-island question_recovery_tests
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: make mingw-w64-x86_64-gcc
      - name: Test battery discovery and passive protocols
        shell: msys2 {0}
        run: |
          for name in battery_discovery attack_shark_battery json_output refresh_policy xbox_bluetooth_identity; do
            g++ -std=c++17 -O2 -Wall -Wextra "vendor/batteryhub/tests/${name}_test.cpp" -o "${name}-tests.exe" || exit 1
            "./${name}-tests.exe" || exit 1
          done
      - name: Build the battery companion from source
        shell: msys2 {0}
        run: make -C vendor/batteryhub -j2 VERSION="$RELEASE_VERSION" CHANNEL=stable
      - name: Package the portable application
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path release-package/Battery -Force | Out-Null
          Copy-Item src-tauri/target/release/dz-island.exe release-package/DZ-Island.exe
          Copy-Item src-tauri/target/release/dz-update-helper.exe release-package/DZUpdater.exe
          $loader = Get-ChildItem src-tauri/target/release/build -Filter WebView2Loader.dll -Recurse | Where-Object FullName -Match '\\out\\x64\\' | Select-Object -First 1
          if (!$loader) { throw 'Missing x64 WebView2Loader.dll' }
          Copy-Item $loader.FullName release-package/WebView2Loader.dll
          Copy-Item LICENSE release-package/LICENSE.txt
          Copy-Item vendor/batteryhub/BatteryHub.exe release-package/Battery/BatteryEngine.exe
          Copy-Item vendor/batteryhub/LICENSE release-package/Battery/LICENSE.txt
          Copy-Item scripts/Perguntar-Na-Ilha.ps1,scripts/PERGUNTAS-NA-ILHA.txt release-package/
          Copy-Item scripts/LEIA-ME-WINDOWS.txt release-package/LEIA-ME.txt
          Invoke-WebRequest https://github.com/Sapd/HeadsetControl/releases/download/4.3.0/headsetcontrol-windows-x86_64.exe -OutFile release-package/Battery/headsetcontrol.exe
          if ((Get-FileHash release-package/Battery/headsetcontrol.exe -Algorithm SHA256).Hash -ne 'E371DA043710DDB8FC70AF77F2CCAD1CD03F8C6F49BA423E08764AD7A94A3C40') { throw 'HeadsetControl checksum mismatch' }
          Copy-Item scripts/BATTERY-THIRD-PARTY-NOTICES.txt release-package/Battery/THIRD_PARTY_NOTICES.txt
          $nsis = Join-Path $env:RUNNER_TEMP 'dz-island-nsis'
          New-Item -ItemType Directory -Path $nsis -Force | Out-Null
          $nsisArchive = Join-Path $nsis 'nsis-3.0.4.1.7z'
          Invoke-WebRequest https://github.com/electron-userland/electron-builder-binaries/releases/download/nsis-3.0.4.1/nsis-3.0.4.1.7z -OutFile $nsisArchive
          if ((Get-FileHash -LiteralPath $nsisArchive).Hash -ne '9877DF902530F96357D13A7A31AE2B9DF67F48B11FFC9A1700A7C961574EC5FA') { throw 'NSIS checksum mismatch' }
          tar -xf $nsisArchive -C $nsis
          if ($LASTEXITCODE -ne 0) { throw 'NSIS extraction failed' }
          $setup = Join-Path $PWD.Path 'DZ-Island-Setup.exe'
          $payload = (Resolve-Path release-package).Path
          & (Join-Path $nsis 'Bin/makensis.exe') /NOCD /V2 "/DVERSION=$env:RELEASE_VERSION" "/DPAYLOAD=$payload" "/DOUTPUT=$setup" scripts/DZ-Island-Setup.nsi
          if ($LASTEXITCODE -ne 0 -or !(Test-Path -LiteralPath $setup)) { throw 'Installer compilation failed' }
          ./scripts/test-windows-setup.ps1 -Setup $setup -Payload $payload -Version $env:RELEASE_VERSION
          $checksums = foreach ($variant in @(
            @{ asset='DZ-Island-portable-windows-x64.zip'; exe='DZ-Island.exe' },
            @{ asset='DZ-Island-windows-x64.zip'; exe='Nectar.exe' }
          )) {
            # Preserve the exact legacy archive layout for already installed updaters.
            if ($variant.exe -eq 'Nectar.exe') {
              Move-Item -LiteralPath release-package/DZ-Island.exe -Destination release-package/Nectar.exe
            }
            Compress-Archive -Path release-package/* -DestinationPath $variant.asset
            $sha = (Get-FileHash -LiteralPath $variant.asset -Algorithm SHA256).Hash.ToLowerInvariant()
            $check = Join-Path 'update-package-check' $variant.exe
            New-Item -ItemType Directory -Path $check -Force | Out-Null
            Copy-Item -LiteralPath $variant.asset -Destination (Join-Path $check 'package.zip')
            $planPath = Join-Path (Resolve-Path $check).Path 'plan.json'
            @{root=(Resolve-Path release-package).Path;parent=0;version=$env:RELEASE_VERSION;digest=$sha} | ConvertTo-Json -Compress | Set-Content -LiteralPath $planPath -Encoding utf8NoBOM
            $validation = Start-Process -FilePath ((Resolve-Path release-package/DZUpdater.exe).Path) -ArgumentList @(('"' + $planPath + '"'), '--validate-only') -WindowStyle Hidden -Wait -PassThru
            if ($validation.ExitCode -ne 0) { throw "Invalid release ZIP: $($variant.asset)" }
            "$sha  $($variant.asset)"
          }
          @($checksums; ((Get-FileHash -LiteralPath $setup).Hash.ToLowerInvariant() + "  DZ-Island-Setup.exe")) | Set-Content SHA256SUMS.txt -Encoding ascii
      - name: Publish the stable release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "v$env:RELEASE_VERSION"
          $existing = gh release view $tag --repo $env:GITHUB_REPOSITORY --json tagName 2>$null
          if ($LASTEXITCODE -eq 0) { throw 'Version already exists. Start a new workflow run instead of rerunning this release.' }
          @'
          - Novo executável DZ-Island.exe e instalador em português. Configurações e atualizações de versões existentes continuam compatíveis.
          - Motor de bateria: leitura alternativa do Windows e HID quando o protocolo específico não fornece porcentagem, com diagnóstico da origem e dos IDs.
          - Receptores identificados sem leitura permanecem visíveis com bateria indisponível, sem porcentagens inventadas.
          - Attack Shark: interpretação passiva ampliada para a família X8 e outros modelos BK; X8 Pro ainda requer validação no hardware.
          - Consultas de metadados reutilizadas por ciclo para reduzir aberturas repetidas de dispositivos.
          - Zeus Pro opcional: nível informado pelo Windows quando conectado por Bluetooth; estimativa identificada com ≈ quando o Bluetooth está desconectado.
          - Recalibração automática a partir de novas leituras Bluetooth e controles manuais de pausa/carga completa.
          - Perguntas e avisos importantes abrem a ilha automaticamente, inclusive em tela cheia, com avisos sonoros nativos do Windows.
          - Perguntas com opções permanecem abertas com o mascote acenando até serem respondidas ou dispensadas, mesmo após a conclusão do agente ou reinicialização da ilha.
          - Respostas tardias são guardadas localmente; configurações existentes são preservadas.

          O receptor USB do Zeus Pro continua sem fornecer bateria, carregamento ou desligamento: sem Bluetooth, esses estados exigem controle manual da estimativa.
          '@ | Set-Content release-notes.md -Encoding utf8
          "`nCommit: $env:GITHUB_SHA" | Add-Content release-notes.md -Encoding utf8
          gh release create $tag DZ-Island-Setup.exe DZ-Island-portable-windows-x64.zip DZ-Island-windows-x64.zip SHA256SUMS.txt --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "DZ Island $env:RELEASE_VERSION" --notes-file release-notes.md
          if ($LASTEXITCODE -ne 0) { throw 'GitHub release failed' }
          if ($env:RELEASE_VERSION -eq '1.11.3') {
            gh release edit v1.11.2 --repo $env:GITHUB_REPOSITORY --prerelease --notes 'Substituída pela versão estável 1.11.3, com instalador nativo. Use a Release estável mais recente.'
          }
