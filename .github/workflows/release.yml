name: Build and publish Windows update
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: windows-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Assign a version for this update
        shell: pwsh
        run: |
          $base = (Get-Content package.json -Raw | ConvertFrom-Json).version.Split('.')
          $version = "$($base[0]).$($base[1]).${{ github.run_number }}"
          bun run bump $version
          "RELEASE_VERSION=$version" >> $env:GITHUB_ENV
      - name: Install frontend dependencies
        run: bun install --frozen-lockfile
      - name: Test local HTTP boundary
        shell: pwsh
        run: |
          rustc --edition=2021 --test src-tauri/src/agent_http.rs -o agent-http-tests.exe
          ./agent-http-tests.exe
          rustc --edition=2021 --test src-tauri/src/update_policy.rs -o update-policy-tests.exe
          ./update-policy-tests.exe
      - name: Test updater archive boundaries
        shell: pwsh
        run: ./scripts/test-portable-update.ps1
      - name: Build the Windows app
        run: bun run tauri build --no-bundle
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: make mingw-w64-x86_64-gcc
      - name: Build the battery companion from source
        shell: msys2 {0}
        run: make -C vendor/batteryhub -j2 VERSION="$RELEASE_VERSION" CHANNEL=stable
      - name: Package the portable application
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path release-package/Battery -Force | Out-Null
          Copy-Item src-tauri/target/release/nectar.exe release-package/Nectar.exe
          $loader = Get-ChildItem src-tauri/target/release/build -Filter WebView2Loader.dll -Recurse | Where-Object FullName -Match '\\out\\x64\\' | Select-Object -First 1
          if (!$loader) { throw 'Missing x64 WebView2Loader.dll' }
          Copy-Item $loader.FullName release-package/WebView2Loader.dll
          Copy-Item LICENSE release-package/LICENSE.txt
          Copy-Item vendor/batteryhub/BatteryHub.exe release-package/Battery/BatteryEngine.exe
          Copy-Item vendor/batteryhub/LICENSE release-package/Battery/LICENSE.txt
          Copy-Item scripts/Perguntar-Na-Ilha.ps1,scripts/PERGUNTAS-NA-ILHA.txt release-package/
          Invoke-WebRequest https://github.com/Sapd/HeadsetControl/releases/download/4.3.0/headsetcontrol-windows-x86_64.exe -OutFile release-package/Battery/headsetcontrol.exe
          if ((Get-FileHash release-package/Battery/headsetcontrol.exe -Algorithm SHA256).Hash -ne 'E371DA043710DDB8FC70AF77F2CCAD1CD03F8C6F49BA423E08764AD7A94A3C40') { throw 'HeadsetControl checksum mismatch' }
          Copy-Item scripts/BATTERY-THIRD-PARTY-NOTICES.txt release-package/Battery/THIRD_PARTY_NOTICES.txt
          Compress-Archive -Path release-package/* -DestinationPath DZ-Island-windows-x64.zip
          $sha = (Get-FileHash DZ-Island-windows-x64.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$sha  DZ-Island-windows-x64.zip" | Set-Content SHA256SUMS.txt -Encoding ascii
      - name: Publish the stable release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "v$env:RELEASE_VERSION"
          $existing = gh release view $tag --repo $env:GITHUB_REPOSITORY --json tagName 2>$null
          if ($LASTEXITCODE -eq 0) { throw 'Version already exists. Start a new workflow run instead of rerunning this release.' }
          gh release create $tag DZ-Island-windows-x64.zip SHA256SUMS.txt --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "DZ Island $env:RELEASE_VERSION" --notes "Atualização automática do DZ Island. Commit: $env:GITHUB_SHA. Configurações locais são preservadas."
          if ($LASTEXITCODE -ne 0) { throw 'GitHub release failed' }
